name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
            moon version --all
            moon update
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev libssl-dev
      - name: Check
        run: moon check
      - name: Build
        run: moon build
      - name: Build examples
        run: |
          moon build example/main
          moon build example/tls
      - name: Test
        run: moon test
