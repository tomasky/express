name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ zlib1g-dev
      - name: Check
        run: moon check
      - name: Build
        run: moon build
      - name: Test
        run: moon test
